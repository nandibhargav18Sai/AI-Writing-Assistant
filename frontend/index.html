<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Writing Assistant</title>

<link rel="icon" href="/frontend/favicon.ico">
<link rel="stylesheet" href="/frontend/style.css?v=6">
<script src="/frontend/script.js?v=7" defer></script>
</head>

<body>

<div class="wrap">

<header class="topbar">
<div class="brand">
<img src="/frontend/logo.png" class="logo">
<span class="dot" id="statusDot"></span>
Writing Assistant
</div>

<button class="btn-ghost" onclick="darkMode()">
🌙 Dark Mode
</button>
</header>


<main class="grid">

<section class="card">

<p class="eyebrow">01 — Compose</p>

<select id="type" onchange="changeType()">
<option>Email</option>
<option>LinkedIn Post</option>
<option>Blog</option>
<option>Essay</option>
<option>Study Notes</option>
<option>Quiz Generation</option>
</select>

<input id="topic" placeholder="What's this about?">

<div id="toneBox">
<input id="tone" placeholder="Tone — formal, friendly, academic">
</div>

<button class="btn-primary" onclick="runAI()">
✍️ Generate
</button>

</section>


<section class="card">

<p class="eyebrow">01 — Refine</p>

<textarea id="text" placeholder="Paste text to improve"></textarea>

<select id="task" onchange="showTemperature()">
<option>Correct Grammar</option>
<option>Rewrite & Improve</option>
<option>Summarize</option>
<option>Expand</option>
</select>

<div id="temperatureBox">

<label>
Temperature:
<span id="temperatureValue">0.5</span>
</label>

<input
id="temperature"
type="range"
min="0"
max="1"
step="0.1"
value="0.5"
oninput="updateTemperature()">

</div>

<button class="btn-primary" onclick="improveAI()">
✨ Improve
</button>

</section>

</main>


<section class="card output">

<p class="eyebrow">02 — Result</p>

<div id="result">
Nothing generated yet.
</div>


<div id="edit" class="subcard hide">

<p class="eyebrow">
Fill Email Details
</p>

<div id="placeholderFields"></div>

<button class="btn-primary" onclick="applyDetails()">
✅ Fill Details
</button>

</div>

</section>


<footer class="actions">

<button class="btn-ghost" onclick="regenerate()">
🔄 Regenerate
</button>

<button class="btn-ghost" onclick="copyText()">
📋 Copy
</button>

<button class="btn-ghost" onclick="saveNotion()">
📝 Notion
</button>

<button class="btn-ghost" onclick="downloadText()">
⬇ Download
</button>

<button class="btn-ghost" onclick="resetPage()">
🗑 Reset
</button>

</footer>


</div>


<div id="toast"></div>

</body>
</html>
